<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada — Wow Bao</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400 800; font-display: swap; src: url('/fonts/jakarta/plus-jakarta-sans-latin-var.woff2') format('woff2'); }
      :root { color-scheme: light dark; --canvas: #faf8f5; --ink: #1c1917; --soft: #57534e; --accent: #c23e19; --on-accent: #fff; }
      @media (prefers-color-scheme: dark) { :root { --canvas: #121010; --ink: #f5f5f4; --soft: #c7c1bc; --accent: #e47a5c; --on-accent: #1c1917; } }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: var(--canvas); color: var(--soft); font: 1.0625rem/1.6 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; }
      p.code { font: 800 clamp(5rem, 22vw, 10rem)/0.9 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: -0.05em; color: var(--accent); }
      h1 { margin-top: 1rem; font: 800 clamp(1.75rem, 6vw, 2.5rem)/1.1 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: -0.03em; color: var(--ink); }
      p.lead { margin: 0.75rem auto 0; max-width: 28rem; }
      a { display: inline-block; margin-top: 2rem; padding: 0.8rem 1.5rem; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Esta página no existe</h1>
      <p class="lead">Puede que el enlace esté mal escrito o que la página se haya movido. Todo lo de Wow Bao está en la página principal.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
